# BaSyx Go eventing example.
#
# Boots PostgreSQL, an MQTT broker (Mosquitto), a Kafka broker (Redpanda), the
# BaSyx configuration service (which installs the schema including the eventing
# outbox patch v1.2.0), and a Submodel Repository with eventing enabled to both
# MQTT and Kafka. See docu/user/eventing_run_guide.md for the full walkthrough.
#
# Images are pulled from ghcr.io/${IMAGE_OWNER}/... — build them first with the
# "Eventing Images (GHCR)" GitHub Actions workflow, or `docker compose build`
# is not used here because the images are prebuilt in GHCR.

services:
  db:
    container_name: eventing_postgres
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxTestDB
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxTestDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mosquitto:
    container_name: eventing_mosquitto
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redpanda:
    container_name: eventing_redpanda
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --set=redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  basyx_configuration:
    container_name: eventing_configuration
    image: ghcr.io/${IMAGE_OWNER}/basyx-configuration-go:${IMAGE_TAG}
    pull_policy: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
    depends_on:
      db:
        condition: service_healthy

  submodel-repository:
    container_name: eventing_submodel_repository
    image: ghcr.io/${IMAGE_OWNER}/basyx-submodelrepository-go:${IMAGE_TAG}
    pull_policy: always
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - CORS_ALLOWEDORIGINS=*
      - CORS_ALLOWEDHEADERS=*
      - CORS_ALLOWEDMETHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DBNAME=basyxTestDB
      - ABAC_ENABLED=false
      - GENERAL_AASREGISTRYINTEGRATION=false
      - GENERAL_SUBMODELREGISTRYINTEGRATION=false
      - GENERAL_EXTERNALURL=http://localhost:8081
      # --- Eventing ---
      - BASYX_EVENTING_ENABLED=true
      - BASYX_EVENTING_OUTBOX_ENABLED=true
      - BASYX_EVENTING_FORMAT=cloudevents
      - BASYX_EVENTING_TOPIC_PREFIX=basyx
      - BASYX_EVENTING_SINKS=mqtt,kafka
      - BASYX_EVENTING_MQTT_BROKER_URL=mqtt://mosquitto:1883
      - BASYX_EVENTING_MQTT_CLIENT_ID=basyx-submodel-repository
      - BASYX_EVENTING_KAFKA_BROKERS=redpanda:9092
      - BASYX_EVENTING_KAFKA_TOPIC=basyx.events
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped
